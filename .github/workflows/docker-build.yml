name: Docker Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t railyard:${{ github.sha }} .

    - name: Test Docker image
      run: |
        # Test that the image runs and shows help or version
        docker run --rm railyard:${{ github.sha }} python -c "import gradio; print('Gradio version:', gradio.__version__)"
        
    - name: Test app imports
      run: |
        # Test that the main app can be imported without errors
        docker run --rm railyard:${{ github.sha }} python -c "from railyard.frontend import create_app; print('App imports successfully')"

    - name: Optional: Push to registry (if needed)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        echo "Would push to container registry here"
        # Add your registry push commands here if needed
        # docker tag railyard:${{ github.sha }} your-registry/railyard:latest
        # docker push your-registry/railyard:latest