models:
  - type: main
    engine: vllm_openai
    api_key_env_var: LITELLM_API_KEY
    parameters:
      openai_api_base: <your-api-base-url>
      model_name: Mistral-Small-24B-W8A8

rails:
  input:
    flows:
      - self check input           # LLM-based input validation
      - check prompt injection     # Uses our guardrail server

prompts:
  - task: self_check_input
    content: |
      Your task is to check if the user message below complies with policy.

      Policy:
      - No questions about the weather

      User message: "{{ user_input }}"

      Should this message be blocked? Answer Yes or No.
      Answer: