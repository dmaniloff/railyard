apiVersion: apps/v1
kind: Deployment
metadata:
  name: railyard
  labels:
    app: railyard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: railyard
  template:
    metadata:
      labels:
        app: railyard
    spec:
      containers:
      - name: railyard
        image: quay.io/diegosquayorg/railyard:latest
        ports:
        - containerPort: 7860
        envFrom:
        - secretRef:
            name: railyard-env
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 7860
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 7860
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: railyard-service
  labels:
    app: railyard
spec:
  selector:
    app: railyard
  ports:
  - protocol: TCP
    port: 80
    targetPort: 7860
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: railyard-route
  labels:
    app: railyard
spec:
  to:
    kind: Service
    name: railyard-service
  port:
    targetPort: 7860
  tls:
    termination: edge